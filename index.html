<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4 - Full Stack Integration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f0f0f0;
        }
        .container {
            background: white;
            padding: 30px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background-color: #e7f3ff;
            border-radius: 5px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Week 4 Task</h1>
        <h3>Front-End + Back-End Integration</h3>
        
        <button onclick="getUsers()">Get Users from API</button>
        <button onclick="checkHealth()">Check Server Health</button>
        
        <div id="result">Click a button to fetch data from API...</div>
    </div>

    <script>
        async function getUsers() {
            document.getElementById('result').innerText = "Loading...";
            try {
                const response = await fetch('http://localhost:3000/users');
                const data = await response.json();
                document.getElementById('result').innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').innerText = "Error: Please start server with 'node server.js'";
            }
        }

        async function checkHealth() {
            document.getElementById('result').innerText = "Checking...";
            try {
                const response = await fetch('http://localhost:3000/health');
                const data = await response.text();
                document.getElementById('result').innerText = "Server Response: " + data;
            } catch (error) {
                document.getElementById('result').innerText = "Error: Server is not running!";
            }
        }
    </script>
</body>
</html>
